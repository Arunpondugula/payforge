server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          default-filters:
            - name: AddResponseHeader
              args:
                name: X-Gateway
                value: payforge-api-gateway
          routes:
            - id: account-route
              uri: http://account-service:8081
              predicates:
                - Path=/api/v1/accounts/**

            - id: ledger-route
              uri: http://ledger-service:8082
              predicates:
                - Path=/api/v1/ledger/**,/api/v1/payment-intents/**
management:
  endpoints:
    web:
      exposure:
        include: gateway, health
  endpoint:
    gateway:
      access: read-only
logging:
  level:
    org.springframework.cloud.gateway: INFO